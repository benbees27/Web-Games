<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulse Panic</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Prevent touch zooming -->
    <meta name="HandheldFriendly" content="true">
    <!-- Fullscreen mode support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="game-container">
        <h1>Pulse Panic</h1>
        <p class="game-instructions">Use wasd keys to move. Collect power ups to make safe zones. Avoid the pulses!</p>
        <div class="score-container">
            <div class="score-text">Score: <span id="currentScore">0</span></div>
            <div class="score-text high-score">High Score: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
