<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Panic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Pulse Panic</h1>
  <p class="game-instructions">Use wasd keys to move. Collect power ups to make safe zones. Avoid the pulses!</p>

    <div class="score-text">Score: <span id="currentScore">0</span></div>
    <div class="score-text high-score">High Score: <span id="highScore">0</span></div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
